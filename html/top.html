<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LÉSCIA | Top Rated</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/top.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/dark-mode.css">
</head>
<body>

    <header class="navbar">
        <a href="../index.html" class="nav-logo">LÉSCIA</a>
        <nav class="nav-menu">
            <a href="../index.html" class="nav-link">
                <span class="material-symbols-outlined">home</span> HOME
            </a>
            <a href="all-product.html" class="nav-link">
                <span class="material-symbols-outlined">grid_view</span> CATEGORY
            </a>
            <a href="top.html" class="nav-link active">
                <span class="material-symbols-outlined">star</span> TOP RATED
            </a>
            <a href="about.html" class="nav-link">
                <span class="material-symbols-outlined">info</span> ABOUT
            </a>
        </nav>

        <div class="nav-actions">
            <button type="button" class="nav-icon" id="dark-mode-toggle" title="Mode Gelap">
                <span class="material-symbols-outlined">dark_mode</span>
            </button>
            <button type="button" class="nav-icon" id="cart-button" title="Keranjang Belanja">
                <span class="material-symbols-outlined">shopping_cart</span>
                <small id="cart-count">0</small>
            </button>
            <button type="button" class="nav-icon" id="profile-button" title="Profil Saya">
                <span class="material-symbols-outlined">person</span>
            </button>
        </div>
    </header>

    <main>
        <section class="top-header">
            <button type="button" class="page-back" id="back-button">← BACK</button>
            <p class="section-small">LÉSCIA EDIT</p>
            <h1>The most <i>loved.</i></h1>
            <p>Our highest-rated pieces, picked by the LÉSCIA girls.</p>
        </section>

        <section class="top-product-grid" id="top-product-grid">
            <p>Loading top rated...</p>
        </section>
    </main>

    <!-- Pop-up Detail Produk -->
    <div class="product-popup" id="product-popup">
        <div class="product-popup-box">
            <button type="button" class="popup-close" id="close-product">×</button>
            <div class="product-popup-image">
                <img id="popup-image" src="" alt="Product">
            </div>
            <div class="product-popup-content">
                <div>
                    <p id="popup-category" class="popup-category"></p>
                    <h2 id="popup-name">Product</h2>
                    <p id="popup-rating" class="popup-rating"></p>
                    <h3 id="popup-price">Rp0</h3>
                    <p id="popup-description"></p>
                    <p id="popup-stock"></p>

                    <div class="popup-size-group" id="popup-size-container">
                        <label>PILIH UKURAN:</label>
                        <div class="size-options" id="size-options"></div>
                    </div>
                </div>

                <div class="popup-button-group">
                    <button type="button" id="add-cart-button" class="add-cart-button">♡ ADD CART</button>
                    <button type="button" id="checkout-button" class="checkout-button">CHECKOUT →</button>
                </div>
            </div>
        </div>
    </div>

<!-- Modal Pop-up Profil Pengguna Dinamis & Elegan (UPDATED LENGKAP) -->
    <div class="profile-popup" id="profile-popup">
        <div class="profile-box">
            <button type="button" class="popup-close" id="close-profile" title="Tutup Profil">×</button>
            
            <div class="profile-title">
                <p class="section-small">MY LÉSCIA PROFILE</p>
                <h2>Hello, <i id="profile-name">User</i> ♡</h2>
                <p>Informasi akun pendaftaran kamu.</p>
            </div>
            
            <div class="profile-content">
                <div class="profile-avatar-box">
                    <div class="profile-avatar">
                        <span class="material-symbols-outlined" style="font-size: 60px;">person</span>
                    </div>
                    <p class="profile-username" id="profile-username">@username</p>
                    <span class="profile-badge">✦ VIP MEMBER</span>
                    
                    <!-- Tombol Edit Utama -->
                    <button type="button" class="btn-edit-profile-main" id="btn-edit-profile-main">
                        ✏️ <span id="teks-edit-profile-main">Edit Profil</span>
                    </button>
                </div>

                <div class="profile-information">
                    <div class="profile-info-grid">
                        <div class="info-item">
                            <label><span class="material-symbols-outlined">badge</span> NAMA LENGKAP</label>
                            <input type="text" class="profile-input" id="profile-fullname" value="-" readonly>
                        </div>
                        <div class="info-item">
                            <label><span class="material-symbols-outlined">mail</span> EMAIL (Terkunci)</label>
                            <input type="email" class="profile-input input-locked" id="profile-email" value="-" readonly>
                        </div>
                        <div class="info-item">
                            <label><span class="material-symbols-outlined">call</span> NOMOR TELEPON</label>
                            <input type="number" class="profile-input" id="profile-phone" value="" placeholder="Belum diisi" readonly>
                        </div>
                        <div class="info-item">
                            <label><span class="material-symbols-outlined">cake</span> TANGGAL LAHIR</label>
                            <input type="date" class="profile-input" id="profile-birthdate" readonly>
                        </div>
                        <div class="info-item" style="grid-column: span 2;">
                            <label><span class="material-symbols-outlined">wc</span> JENIS KELAMIN</label>
                            <select class="profile-input" id="profile-gender" disabled>
                                <option value="">Belum dipilih</option>
                                <option value="Perempuan">Perempuan</option>
                                <option value="Laki-laki">Laki-laki</option>
                            </select>
                        </div>
                    </div>

                    <div class="profile-bio-box">
                        <label><span class="material-symbols-outlined">history_edu</span> BIO SINGKAT</label>
                        <textarea class="profile-input" id="profile-bio" placeholder="Tuliskan sedikit tentang style kamu..." maxlength="150" readonly></textarea>
                    </div>

                    <div class="profile-address-box">
                        <label><span class="material-symbols-outlined">local_shipping</span> ALAMAT PENGIRIMAN DEFAULT</label>
                        <textarea class="profile-input" id="profile-address" placeholder="Tuliskan alamat pengiriman kamu secara detail..." readonly></textarea>
                    </div>
                </div>
            </div>

            <div class="profile-actions">
                <button type="button" class="logout-button" id="logout-button">
                    LOG OUT AKUN <span class="material-symbols-outlined" style="margin-left: 5px;">logout</span>
                </button>
            </div>
        </div>
    </div>

    <script src="../js/script.js"></script>
    <script src="../js/top.js"></script>
</body>
</html>
