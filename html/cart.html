<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LÉSCIA | Keranjang</title>

    <!-- Google Icons (Material Symbols Outlined) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">

    <!-- Stylesheet Eksternal -->
    <link rel="stylesheet" href="../css/cart.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/dark-mode.css">
</head>
<body>

    <!-- Header Navigasi Sederhana Halaman Keranjang -->
    <header class="bilah-navigasi">
        <a href="../index.html" class="logo-navigasi">LÉSCIA</a>
        <div class="cart-nav-actions">
            <button type="button" class="nav-icon" id="dark-mode-toggle" title="Mode Gelap">
                <span class="material-symbols-outlined">dark_mode</span>
            </button>
            <button type="button" class="tombol-kembali" id="tombol-kembali">← KEMBALI</button>
        </div>
    </header>

    <main class="halaman-keranjang">
        <section class="pala-keranjang">
            <p class="teks-kecil">KERANJANG KAMU</p>
            <h1>Keranjang <i>belanja.</i></h1>
            <p>Pilih produk favoritmu sebelum melakukan checkout ♡</p>
        </section>

        <section class="konten-keranjang">
            <div class="bagian-kiri-keranjang">
                <div class="kotak-pilih-semua" id="kotak-pilih-semua">
                    <input type="checkbox" id="centang-pilih-semua" class="centang-keranjang">
                    <label for="centang-pilih-semua">PILIH SEMUA</label>
                </div>

                <div class="daftar-keranjang" id="daftar-keranjang"></div>

                <!-- Formulir Alamat Pengiriman -->
                <div class="kotak-alamat">
                    <div class="judul-kotak-alamat">
                        <div class="pala-alamat-kiri">
                            <span class="material-symbols-outlined">location_on</span>
                            <h3>ALAMAT PENGIRIMAN</h3>
                        </div>
                        <!-- Tombol pensil untuk mengedit alamat -->
                        <button type="button" class="tombol-edit-alamat" id="tombol-edit-alamat" title="Edit Alamat Pengiriman">
                            ✏️ <span id="teks-tombol-edit">Edit</span>
                        </button>
                    </div>
                    
                    <div class="baris-formulir">
                        <div>
                            <label for="nama-penerima">NAMA PENERIMA</label>
                            <input type="text" id="nama-penerima" placeholder="Nama lengkap penerima">
                        </div>
                        <div>
                            <label for="telepon-penerima">NOMOR TELEPON / HP</label>
                            <input type="number" id="telepon-penerima" placeholder="Contoh: 081234567890" min="0">
                        </div>
                    </div>

                    <div class="baris-formulir" id="baris-dropdown-1">
                        <div>
                            <label for="provinsi">PROVINSI</label>
                            <select id="provinsi">
                                <option value="">Pilih Provinsi</option>
                            </select>
                        </div>
                        <div>
                            <label for="kota">KOTA / KABUPATEN</label>
                            <select id="kota">
                                <option value="">Pilih Kota / Kabupaten</option>
                            </select>
                        </div>
                    </div>

                    <div class="baris-formulir" id="baris-dropdown-2">
                        <div>
                            <label for="kecamatan">KECAMATAN</label>
                            <select id="kecamatan">
                                <option value="">Pilih Kecamatan</option>
                            </select>
                        </div>
                        <div>
                            <label for="kode-pos">KODE POS</label>
                            <input type="text" id="kode-pos" placeholder="Kode Pos" readonly>
                        </div>
                    </div>

                    <label for="alamat-lengkap">ALAMAT LENGKAP</label>
                    <textarea id="alamat-lengkap" placeholder="Nama jalan, No. Rumah, RT/RW, Patokan..."></textarea>
                </div>
            </div>

            <aside class="kotak-ringkasan">
                <h2>Ringkasan</h2>
                <div class="baris-ringkasan">
                    <span>Barang Terpilih</span>
                    <span id="jumlah-terpilih">0</span>
                </div>
                <div class="baris-ringkasan baris-total">
                    <span>Total Pembayaran</span>
                    <strong id="total-keranjang">Rp0</strong>
                </div>
                
                <hr>

                <div class="kelompok-pembayaran">
                    <label for="metode-pembayaran">METODE PEMBAYARAN</label>
                    <select id="metode-pembayaran">
                        <option value="">Pilih metode pembayaran</option>
                        <option value="COD">COD (Bayar di Tempat)</option>
                        <option value="Transfer Bank">Transfer Bank</option>
                        <option value="QRIS">QRIS</option>
                    </select>
                </div>
                
                <button type="button" class="tombol-checkout" id="tombol-checkout">CHECKOUT SEKARANG →</button>
            </aside>
        </section>
    </main>

    <!-- Modal Pop-Up QRIS -->
    <div class="modal-qris" id="modal-qris">
        <div class="kotak-qris">
            <button type="button" class="tutup-qris" id="tutup-qris">×</button>
            <h2>PEMBAYARAN QRIS</h2>
            <p class="subjudul-qris">Scan QR di bawah ini via M-Banking / E-Wallet ♡</p>
            
            <div class="kartu-qris">
                <div class="logo-pembayaran-qris">LÉSCIA PAY</div>
                <div class="pembungkus-gambar-qris">
                    <img id="gambar-qris-api" src="" alt="Memuat QRIS..." style="width: 100%; height: 100%; object-fit: contain;">
                </div>
                <p class="label-nominal-qris">TOTAL PEMBAYARAN</p>
                <h3 id="total-nominal-qris">Rp0</h3>
                <small id="id-transaksi-qris">ID-TRX: -</small>
            </div>

            <button type="button" class="tombol-checkout" id="tombol-konfirmasi-qris">SAYA SUDAH BAYAR ✓</button>
        </div>
    </div>

    <!-- Script JS -->
    <script src="../js/script.js"></script>
    <script src="../js/cart.js"></script>
</body>
</html>
